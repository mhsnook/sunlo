name: Tests

on:
  push:
    # Version-named release branches (next-0.28, next-0.28.1) plus bare `next`.
    # Globs are required here — Actions matches branch filters literally otherwise,
    # so a plain `next` would silently skip CI on every `next-*` branch.
    branches: [next, 'next-*']
  pull_request:
    branches: [next, 'next-*', main]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  pr-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'pull_request'
    permissions:
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The formatter gate is scoped to the files this PR touches, so the job
      # has to say which those are. Two-dot diff, because `actions/checkout`
      # leaves us on the MERGE ref for a `pull_request` event — base is already
      # merged in, so base.sha..HEAD is exactly this PR's own changes. Switch to
      # three-dot if the checkout ever pins `pull_request.head.sha`.
      - name: List files this PR touches
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null ||
            git fetch --no-tags --depth=1 origin "$BASE_SHA"
          git diff --name-only --diff-filter=d "$BASE_SHA" HEAD |
            sort > /tmp/pr-touched.txt
          wc -l < /tmp/pr-touched.txt

      # Typecheck, lint, and formatter-drift all diff the PR against the base
      # branch, so they share one job: the base branch is checked out and
      # installed once here, not once per check. Each tool's commands are
      # unchanged from when these were three jobs.
      - name: Collect PR branch results
        run: |
          # tsc and lint are read-only, so run them concurrently — tsc is the
          # long pole and the lint pass completes underneath it.
          ( pnpm check 2>&1 | grep ': error TS' | sort > /tmp/pr-errors.txt || true ) &
          ( pnpm exec oxlint . -f unix > /tmp/pr-oxlint.txt 2>&1 || true
            pnpm exec eslint . -f unix > /tmp/pr-eslint.txt 2>&1 || true
            cat /tmp/pr-oxlint.txt /tmp/pr-eslint.txt \
              | grep -E '^[^:[:space:]][^:]*:[0-9]+:[0-9]+:' \
              | sort -u > /tmp/pr-lint.txt || true ) &
          wait
          # Formatter rewrites files, so it runs after the read-only checks; the
          # modified set IS the drift. Restore the tree afterward.
          pnpm exec oxfmt . > /dev/null 2>&1 || true
          pnpm exec prettier --write 'supabase/**/*.sql' > /dev/null 2>&1 || true
          git diff --name-only | sort > /tmp/pr-format.txt
          git checkout -- .

      - name: Collect base branch results
        run: |
          git worktree add /tmp/base-branch origin/${{ github.base_ref }}
          cd /tmp/base-branch
          pnpm install --frozen-lockfile --silent
          ( pnpm check 2>&1 | grep ': error TS' | sort > /tmp/base-errors.txt || true ) &
          ( pnpm exec oxlint . -f unix > /tmp/base-oxlint.txt 2>&1 || true
            pnpm exec eslint . -f unix > /tmp/base-eslint.txt 2>&1 || true
            cat /tmp/base-oxlint.txt /tmp/base-eslint.txt \
              | grep -E '^[^:[:space:]][^:]*:[0-9]+:[0-9]+:' \
              | sort -u > /tmp/base-lint.txt || true ) &
          wait
          pnpm exec oxfmt . > /dev/null 2>&1 || true
          pnpm exec prettier --write 'supabase/**/*.sql' > /dev/null 2>&1 || true
          git diff --name-only | sort > /tmp/base-format.txt
          cd $GITHUB_WORKSPACE
          git worktree remove --force /tmp/base-branch

      - name: Comment results on PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            // Shared diff engine. Typecheck and lint ran an IDENTICAL two-pass
            // differential — only their line parser differed — so it lives here
            // once. proximity:true runs the shift-tolerant second pass;
            // proximity:false is a plain set diff (formatter drift). Behaviour is
            // unchanged from the three former jobs; only the per-check RENDERING
            // below stays separate, because the sections format differently.
            const PROXIMITY = 10;
            const differential = (baseLines, prLines, parse, proximity) => {
              const baseSet = new Set(baseLines), prSet = new Set(prLines);
              const added = prLines.filter(l => !baseSet.has(l)).map(parse);
              const resolvedCandidates = baseLines.filter(l => !prSet.has(l)).map(parse);
              const base = baseLines.length, pr = prLines.length;
              if (!proximity) return { base, pr, added, resolved: resolvedCandidates, moved: [] };
              // Pair a "new" with a "resolved" when it's the same item shifted
              // within ±10 lines (same file + column + message) — an unrelated
              // edit just bumped its line number. Changed column ⇒ fair game.
              const resolvedPool = [...resolvedCandidates];
              const newItems = [];
              const moved = [];
              for (const n of added) {
                const idx = resolvedPool.findIndex(r =>
                  r.file === n.file && r.col === n.col && r.rest === n.rest &&
                  Math.abs(r.line - n.line) <= PROXIMITY
                );
                if (idx >= 0) { moved.push({ from: resolvedPool[idx], to: n }); resolvedPool.splice(idx, 1); }
                else { newItems.push(n); }
              }
              return { base, pr, added: newItems, resolved: resolvedPool, moved };
            };
            const read = (p) =>
              fs.existsSync(p) ? fs.readFileSync(p, 'utf8').trim().split('\n').filter(Boolean) : [];

            // Line parsers — the only part of the diff that differed per check.
            const tscParse = (raw) => {
              const m = raw.match(/^(.+?)\((\d+),(\d+)\):\s*(error\s+TS\d+:\s*.*)$/);
              if (!m) return { file: '', line: 0, col: 0, rest: raw, raw };
              return { file: m[1], line: parseInt(m[2], 10), col: parseInt(m[3], 10), rest: m[4], raw };
            };
            const lintParse = (raw) => {
              const m = raw.match(/^([^:]+):(\d+):(\d+):\s*(.*)$/);
              if (!m) return { file: '', line: 0, col: 0, rest: raw, raw };
              return { file: m[1], line: parseInt(m[2], 10), col: parseInt(m[3], 10), rest: m[4], raw };
            };
            const fileParse = (raw) => ({ file: raw, line: 0, col: 0, rest: raw, raw });

            const movedNote = (moved) =>
              moved.length ? ` (${moved.length} shifted within ±${PROXIMITY} lines, not counted)` : '';

            // ── Per-check rendering, verbatim from each former job ───────────
            // typecheck: New/Resolved lists are unbounded (as in the old job).
            const tscSection = (d) => {
              fs.writeFileSync('/tmp/tsc-new-count.txt', String(d.added.length));
              const summary = `**Before:** ${d.base} error(s) → **After:** ${d.pr} error(s)` +
                (d.added.length || d.resolved.length
                  ? ` (+${d.added.length} new, −${d.resolved.length} resolved)${movedNote(d.moved)}`
                  : ` (no change)${movedNote(d.moved)}`);
              const lines = ['#### TypeScript type check', '', summary];
              if (d.added.length > 0)
                lines.push(`\n**New (${d.added.length}):**\n\`\`\`\n${d.added.map(e => e.raw).join('\n')}\n\`\`\``);
              if (d.resolved.length > 0)
                lines.push(`\n**Resolved (${d.resolved.length}):**\n\`\`\`\n${d.resolved.map(e => e.raw).join('\n')}\n\`\`\``);
              return lines.join('\n');
            };

            // lint: New/Resolved lists cap at 50 (as in the old job).
            const lintSection = (d) => {
              fs.writeFileSync('/tmp/lint-new-count.txt', String(d.added.length));
              const summary = `**Before:** ${d.base} issue(s) → **After:** ${d.pr} issue(s)` +
                (d.added.length || d.resolved.length
                  ? ` (+${d.added.length} new, −${d.resolved.length} resolved)${movedNote(d.moved)}`
                  : ` (no change)${movedNote(d.moved)}`);
              const lines = ['#### Lint (oxlint + eslint)', '', summary];
              if (d.added.length > 0)
                lines.push(`\n**New (${d.added.length}):**\n\`\`\`\n${d.added.slice(0, 50).map(e => e.raw).join('\n')}\n${d.added.length > 50 ? `… and ${d.added.length - 50} more` : ''}\n\`\`\``);
              if (d.resolved.length > 0)
                lines.push(`\n**Resolved (${d.resolved.length}):**\n\`\`\`\n${d.resolved.slice(0, 50).map(e => e.raw).join('\n')}\n${d.resolved.length > 50 ? `… and ${d.resolved.length - 50} more` : ''}\n\`\`\``);
              return lines.join('\n');
            };

            // formatter drift: the blocking half is the intersection with the
            // files this PR touched — a file you edited ships formatted, whether
            // its drift is new or was there all along. That is NOT the lint rule,
            // and deliberately so: formatting is per-file, not per-issue. The
            // repo-wide before/after stays informational, with the trend arrow
            // carrying it. Lists cap at 50.
            const formatSection = (d, prFiles, touched, touchedKnown) => {
              const dirtyTouched = prFiles.filter(f => touched.has(f));
              const elsewhere = d.added.map(e => e.raw).filter(f => !touched.has(f));
              const resolved = d.resolved.map(e => e.raw);
              fs.writeFileSync('/tmp/format-touched-count.txt', String(dirtyTouched.length));
              fs.writeFileSync('/tmp/format-touched-known.txt', touchedKnown ? '1' : '0');
              const trend = d.pr < d.base ? '🟢' : d.pr > d.base ? '🔺' : '➖';
              const summary = `${trend} **Before:** ${d.base} file(s) → **After:** ${d.pr} file(s)` +
                (d.added.length || resolved.length
                  ? ` (+${d.added.length} new, −${resolved.length} reformatted)`
                  : ` (no change)`);
              // Group the remaining drift by extension: 80 files that are all
              // .sql migrations read very differently from 80 spread across .tsx
              // and .ts — and a lone stray (say one .css) is easy to spot and fold in.
              const byExt = (files) => {
                const counts = {};
                for (const f of files) {
                  const name = f.slice(f.lastIndexOf('/') + 1);
                  const dot = name.lastIndexOf('.');
                  const ext = dot > 0 ? name.slice(dot) : '(no ext)';
                  counts[ext] = (counts[ext] || 0) + 1;
                }
                return Object.entries(counts).sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]));
              };
              const block = (title, list) =>
                list.length === 0 ? null :
                `\n**${title} (${list.length}):**\n\`\`\`\n${list.slice(0, 50).join('\n')}` +
                `${list.length > 50 ? `\n… and ${list.length - 50} more` : ''}\n\`\`\``;
              const verdict =
                !touchedKnown
                  ? '⚠️ No list of touched files was produced, so the touched-file check could not run.'
                  : dirtyTouched.length
                    ? `❌ **${dirtyTouched.length} file(s) this PR touches are not formatted.** Run \`pnpm format\` and commit — a file you edited ships formatted, whatever state it was in before.`
                    : '✅ Every file this PR touches is formatted.';
              const ext = byExt(prFiles);
              const lines = [
                '#### Formatter drift (`pnpm format`)',
                '',
                verdict,
                block('Touched and unformatted', dirtyTouched),
                '',
                'The repo-wide total below is **context, not a gate** — formatting debt to drive toward **0** by reformatting legacy files as you touch them.',
                '',
                summary,
                ext.length ? '\n**By type:** ' + ext.map(([e, n]) => '`' + e + '` ' + n).join(' · ') : null,
                block('Newly unformatted elsewhere', elsewhere),
                block('Reformatted / cleaned up', resolved),
              ];
              return lines.filter(l => l !== null).join('\n');
            };

            // An absent touched.txt is NOT an empty PR — it means the step that
            // writes it did not run. Record that, and let the gate refuse to pass.
            const touchedKnown = fs.existsSync('/tmp/pr-touched.txt');
            const touched = new Set(read('/tmp/pr-touched.txt'));
            const fmtPr = read('/tmp/pr-format.txt');
            const tsc  = differential(read('/tmp/base-errors.txt'), read('/tmp/pr-errors.txt'), tscParse,  true);
            const lint = differential(read('/tmp/base-lint.txt'),   read('/tmp/pr-lint.txt'),   lintParse, true);
            const fmt  = differential(read('/tmp/base-format.txt'), fmtPr, fileParse, false);

            const marker = '### PR checks';
            const body = [
              marker, '',
              tscSection(tsc), '', '---', '',
              lintSection(lint), '', '---', '',
              formatSection(fmt, fmtPr, touched, touchedKnown),
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo,
                comment_id: existing.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: context.issue.number, body,
              });
            }

            // Retire the standalone comments from when these were separate jobs.
            const retired = ['### TypeScript type check', '### Lint (oxlint + eslint)', '### Formatter drift'];
            for (const c of comments) {
              if (retired.some(m => c.body.startsWith(m))) {
                try {
                  await github.rest.issues.deleteComment({
                    owner: context.repo.owner, repo: context.repo.repo, comment_id: c.id,
                  });
                } catch (e) { /* best-effort cleanup */ }
              }
            }

      # Typecheck and lint gate on the DELTA — new issues only, so a legacy
      # backlog never blocks a PR. The formatter gates on the PR's own
      # FOOTPRINT instead: every file it touched, new drift or old.
      - name: Fail on new errors, new lint issues, or unformatted touched files
        run: |
          TSC=$(cat /tmp/tsc-new-count.txt 2>/dev/null || echo 0)
          LINT=$(cat /tmp/lint-new-count.txt 2>/dev/null || echo 0)
          FMT=$(cat /tmp/format-touched-count.txt 2>/dev/null || echo 0)
          FMT_KNOWN=$(cat /tmp/format-touched-known.txt 2>/dev/null || echo 0)
          FAIL=0
          if [ "$TSC" -gt 0 ]; then echo "❌ $TSC new type error(s)"; FAIL=1; fi
          if [ "$LINT" -gt 0 ]; then echo "❌ $LINT new lint issue(s)"; FAIL=1; fi
          if [ "$FMT_KNOWN" != "1" ]; then
            echo "❌ no list of touched files was produced — the formatter check did not run"
            FAIL=1
          elif [ "$FMT" -gt 0 ]; then
            echo "❌ $FMT touched file(s) are not formatted — run 'pnpm format'"
            FAIL=1
          fi
          if [ "$FAIL" -ne 0 ]; then
            echo "See the '### PR checks' comment for details"
            exit 1
          fi

  bundle-size:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request'
    permissions:
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Set up dummy env for build
        run: |
          echo "VITE_SUPABASE_URL=http://127.0.0.1:54321" >> $GITHUB_ENV
          echo "VITE_SUPABASE_ANON_KEY=dummy" >> $GITHUB_ENV

      - name: Install dependencies (PR)
        run: pnpm install --frozen-lockfile

      - name: Build PR branch
        run: pnpm build:test

      - name: Build base branch
        run: |
          git worktree add /tmp/base-branch origin/${{ github.base_ref }}
          cd /tmp/base-branch
          pnpm install --frozen-lockfile --silent
          pnpm build:test

      - name: Comment on PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const zlib = require('zlib');

            // Measure the eager-load assets of a built dist/ dir: the entry
            // <script> plus every <link rel="modulepreload"> JS chunk, and the
            // <link rel="stylesheet"> CSS — everything listed in index.html.
            const measure = (dist) => {
              const html = fs.readFileSync(path.join(dist, 'index.html'), 'utf8');
              const files = [...new Set(
                [...html.matchAll(/assets\/[A-Za-z0-9._-]+\.(?:js|css)/g)].map((m) => m[0])
              )];
              let eagerRaw = 0, eagerGz = 0;
              let cssRaw = 0, cssGz = 0;
              let index = { raw: 0, gz: 0 };
              const vendors = {};
              for (const rel of files) {
                const buf = fs.readFileSync(path.join(dist, rel));
                const raw = buf.length, gz = zlib.gzipSync(buf).length;
                const name = rel.slice('assets/'.length);
                if (name.endsWith('.css')) {
                  // CSS shipped in index.html is render-blocking on first paint,
                  // so it's part of the eager cost but tracked on its own axis.
                  cssRaw += raw; cssGz += gz;
                  continue;
                }
                eagerRaw += raw; eagerGz += gz;
                if (name.includes('-vendor-')) {
                  // strip Vite's trailing 8-char content hash for a stable key
                  vendors[name.replace(/-[A-Za-z0-9_-]{8}\.js$/, '')] = { file: name, raw, gz };
                } else if (name.startsWith('index-')) {
                  index = { raw, gz };
                }
              }
              return { eagerRaw, eagerGz, cssRaw, cssGz, index, vendors };
            };

            const pr = measure('dist');
            const base = measure('/tmp/base-branch/dist');

            const fmt = (n) => (n / 1024).toFixed(2) + ' kB';
            const diff = (p, b) => {
              const d = p - b;
              const pct = b ? ((d / b) * 100).toFixed(2) : '0.00';
              const sign = d > 0 ? '+' : '';
              const emoji = d > 0 ? '🔺' : d < 0 ? '🟢' : '➖';
              return `${emoji} ${sign}${(d / 1024).toFixed(2)} kB (${sign}${pct}%)`;
            };
            const table = (pRaw, pGz, bRaw, bGz) => [
              '|         | Base            | PR              | Δ                    |',
              '|---------|-----------------|-----------------|----------------------|',
              `| Raw     | ${fmt(bRaw).padEnd(15)} | ${fmt(pRaw).padEnd(15)} | ${diff(pRaw, bRaw)} |`,
              `| Gzipped | ${fmt(bGz).padEnd(15)} | ${fmt(pGz).padEnd(15)} | ${diff(pGz, bGz)} |`,
            ].join('\n');

            // Vendor chunks compared by logical name — an identical hash means identical content.
            const vendorNames = [...new Set([...Object.keys(base.vendors), ...Object.keys(pr.vendors)])].sort();
            const changed = [];
            const unchanged = [];
            let unchangedRaw = 0, unchangedGz = 0;
            for (const n of vendorNames) {
              const b = base.vendors[n], p = pr.vendors[n];
              if (b && p && b.file === p.file) {
                unchanged.push(n);
                unchangedRaw += p.raw;
                unchangedGz += p.gz;
              } else {
                changed.push({ n, b, p });
              }
            }

            let vendorSection;
            if (vendorNames.length === 0) {
              vendorSection = '_No vendor chunks in the eager set._';
            } else if (changed.length === 0) {
              vendorSection = `✅ **Vendor chunks unchanged** — ${unchanged.join(', ')} totalling `
                + `${fmt(unchangedRaw)} raw (${fmt(unchangedGz)} gzipped), all still cached for repeat visitors.`;
            } else {
              const rows = changed.map(({ n, b, p }) => {
                if (!b) return `- 🆕 \`${n}\` added — ${fmt(p.raw)} raw (${fmt(p.gz)} gz)`;
                if (!p) return `- ❌ \`${n}\` removed — was ${fmt(b.raw)} raw`;
                return `- 🔺 \`${n}\` — ${fmt(b.raw)} → ${fmt(p.raw)} raw (${diff(p.raw, b.raw)})`;
              });
              const stable = unchanged.length
                ? `\n\n${unchanged.length} other vendor chunk(s) unchanged — ${fmt(unchangedRaw)} raw (${fmt(unchangedGz)} gz).`
                : '';
              vendorSection = `**Vendor chunks changed:**\n${rows.join('\n')}${stable}`;
            }

            const body = [
              '### Main bundle size',
              '',
              '**Eager load** — entry chunk + every `modulepreload` in `index.html` (what a first paint downloads)',
              '',
              table(pr.eagerRaw, pr.eagerGz, base.eagerRaw, base.eagerGz),
              '',
              '**`index-*.js`** — the non-vendored entry chunk, re-downloaded on every deploy',
              '',
              table(pr.index.raw, pr.index.gz, base.index.raw, base.index.gz),
              '',
              '**CSS** — stylesheets linked in `index.html` (render-blocking on first paint)',
              '',
              table(pr.cssRaw, pr.cssGz, base.cssRaw, base.cssGz),
              '',
              vendorSection,
            ].join('\n');

            const marker = '### Main bundle size';
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo,
                comment_id: existing.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: context.issue.number, body,
              });
            }

  prod-bundle-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Set up dummy env for build
        run: |
          echo "VITE_SUPABASE_URL=http://127.0.0.1:54321" >> $GITHUB_ENV
          echo "VITE_SUPABASE_ANON_KEY=dummy" >> $GITHUB_ENV

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build production bundle
        run: pnpm build

      - name: Scan bundle for leaked dev-only code
        run: ./scripts/check-prod-bundle.sh dist

  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit tests
        run: pnpm test:unit

  scenetest:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.76.14

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Cache Playwright browsers (scenetest uses Playwright under the hood)
      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(pnpm exec playwright --version | cut -d' ' -f2)" >> $GITHUB_OUTPUT

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Install Playwright dependencies (cached browsers)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      # Cache Docker layers for Supabase
      - name: Cache Docker layers
        uses: jpribyl/action-docker-layer-caching@v0.1.1
        with:
          key: docker-layers-${{ runner.os }}-supabase-${{ hashFiles('supabase/config.toml') }}
          restore-keys: docker-layers-${{ runner.os }}-supabase-
        continue-on-error: true

      - name: Start Supabase
        run: supabase start -x studio,imgproxy,logflare,vector,supavisor,edge-runtime,inbucket

      - name: Set up environment variables
        run: |
          echo "VITE_SUPABASE_URL=http://127.0.0.1:54321" >> $GITHUB_ENV
          echo "VITE_SUPABASE_ANON_KEY=$(supabase status -o json | jq -r '.ANON_KEY')" >> $GITHUB_ENV
          echo "SUPABASE_SERVICE_ROLE_KEY=$(supabase status -o json | jq -r '.SERVICE_ROLE_KEY')" >> $GITHUB_ENV

      - name: Start dev server
        run: pnpm dev:local &

      - name: Wait for dev server
        run: npx wait-on http://localhost:5173 --timeout 60000

      - name: Run scenetest specs
        id: scene
        continue-on-error: true
        run: |
          rm -rf scenetest/.reports
          pnpm scene:ci

      - name: Comment scenetest results on PR
        if: github.event_name == 'pull_request' && !cancelled()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const dir = 'scenetest/.reports';
            const marker = '### Scenetest';

            const upsertComment = async (body) => {
              const { data: comments } = await github.rest.issues.listComments({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: context.issue.number,
              });
              const existing = comments.find(c => c.body.startsWith(marker));
              if (existing) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner, repo: context.repo.repo,
                  comment_id: existing.id, body,
                });
              } else {
                await github.rest.issues.createComment({
                  owner: context.repo.owner, repo: context.repo.repo,
                  issue_number: context.issue.number, body,
                });
              }
            };

            if (!fs.existsSync(dir)) {
              await upsertComment([marker, '', '_No report was produced — scenetest may have crashed before writing output. Check the job log._'].join('\n'));
              return;
            }
            const jsonFiles = fs.readdirSync(dir)
              .filter(f => f.endsWith('.json'))
              .map(f => ({ f, mtime: fs.statSync(path.join(dir, f)).mtimeMs }))
              .sort((a, b) => b.mtime - a.mtime);
            if (jsonFiles.length === 0) {
              await upsertComment([marker, '', '_No JSON report found in `scenetest/.reports/`._'].join('\n'));
              return;
            }

            const report = JSON.parse(fs.readFileSync(path.join(dir, jsonFiles[0].f), 'utf8'));
            const s = report.summary;
            const headline = `Scenes: ${s.completed}/${s.scenes} completed · Assertions: ${s.assertions.passed}/${s.assertions.total} passed · Console errors: ${s.consoleErrors} · Duration: ${report.duration}ms`;

            const failed = report.scenes.filter(sc => sc.status !== 'completed' || sc.assertions.some(a => !a.result));
            const lines = [marker, '', headline];

            if (failed.length === 0) {
              lines.push('', 'All scenes passed ✅');
            } else {
              const cap = (str, n) => str && str.length > n ? str.slice(0, n) + '…' : str;
              const blocks = [];
              for (const sc of failed) {
                const b = [];
                const status = sc.status === 'completed' ? 'ASSERTION FAILED' : sc.status.toUpperCase();
                b.push(`✗ ${sc.name} — ${status}`);
                b.push(`  file: ${sc.file}`);
                if (sc.error) b.push(`  error: ${cap(sc.error.replace(/\s+/g, ' '), 1000)}`);
                const failedAssertions = sc.assertions.filter(a => !a.result).slice(0, 10);
                for (const a of failedAssertions) {
                  const loc = a.location ? ` (${a.location.file}:${a.location.line})` : '';
                  const actor = a.actor ? ` [${a.actor}]` : '';
                  b.push(`  ✗ ${cap(a.description, 200)}${actor}${loc}`);
                }
                blocks.push(b.join('\n'));
              }
              lines.push('', `**Failed (${failed.length}):**`, '', '```', blocks.join('\n\n'), '```');
            }

            let body = lines.join('\n');
            if (body.length > 60000) body = body.slice(0, 60000) + '\n… (truncated)\n```';
            await upsertComment(body);

      - name: Upload scenetest report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: scenetest-report
          path: scenetest/.reports/
          retention-days: 30

      - name: Fail job if scenetest failed
        if: steps.scene.outcome == 'failure'
        run: |
          echo "❌ scenetest reported failures — see PR comment"
          exit 1
